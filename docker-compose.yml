version: "3.8"

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: agency_password
      POSTGRES_DB: agency_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency -d agency_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
